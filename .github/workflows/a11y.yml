name: Accessibilité

on:
  pull_request:
    branches: [dev, main]
  workflow_call: # permet à release.yml de lancer ce workflow et d'attendre son résultat

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.TEST_FIREBASE_AUTH_DOMAIN }}
      NUXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.TEST_FIREBASE_DATABASE_URL }}
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.TEST_FIREBASE_PROJECT_ID }}
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.TEST_FIREBASE_STORAGE_BUCKET }}
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.TEST_FIREBASE_MESSAGING_SENDER_ID }}
      NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.TEST_FIREBASE_APP_ID }}
      CYPRESS_ADMIN_EMAIL: ${{ secrets.CYPRESS_ADMIN_EMAIL }}
      CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm exec playwright test

      - name: Rapport
        if: always()
        env:
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/test-report.mjs a11y

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-a11y
          path: reports/a11y.md

  report:
    needs: a11y
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-report.yml
    with:
      suite: a11y