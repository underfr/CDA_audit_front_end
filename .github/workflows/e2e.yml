name: E2E

on:
  pull_request:
    branches: [dev, main]
  workflow_call: # permet à release.yml de lancer ce workflow et d'attendre son résultat

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.TEST_FIREBASE_AUTH_DOMAIN }}
      NUXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.TEST_FIREBASE_DATABASE_URL }}
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.TEST_FIREBASE_PROJECT_ID }}
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.TEST_FIREBASE_STORAGE_BUCKET }}
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.TEST_FIREBASE_MESSAGING_SENDER_ID }}
      NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.TEST_FIREBASE_APP_ID }}
      CYPRESS_COLLABORATOR_EMAIL: ${{ secrets.CYPRESS_COLLABORATOR_EMAIL }}
      CYPRESS_COLLABORATOR_PASSWORD: ${{ secrets.CYPRESS_COLLABORATOR_PASSWORD }}
      CYPRESS_TECHNICIAN_EMAIL: ${{ secrets.CYPRESS_TECHNICIAN_EMAIL }}
      CYPRESS_TECHNICIAN_PASSWORD: ${{ secrets.CYPRESS_TECHNICIAN_PASSWORD }}
      CYPRESS_MANAGER_EMAIL: ${{ secrets.CYPRESS_MANAGER_EMAIL }}
      CYPRESS_MANAGER_PASSWORD: ${{ secrets.CYPRESS_MANAGER_PASSWORD }}
      CYPRESS_COLLABORATOR_2_EMAIL: ${{ secrets.CYPRESS_COLLABORATOR_2_EMAIL }}
      CYPRESS_COLLABORATOR_2_PASSWORD: ${{ secrets.CYPRESS_COLLABORATOR_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec cypress install # pnpm-workspace.yaml bloque le téléchargement auto (cypress: false)

      - run: pnpm build

      - name: Tests E2E
        run: |
          node .output/server/index.mjs &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000/login; do sleep 1; done'
          pnpm exec cypress run

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
      - name: Rapport
        if: always()
        env:
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/test-report.mjs e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-e2e
          path: reports/e2e.md
  report:
    needs: e2e
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-report.yml
    with:
      suite: e2e